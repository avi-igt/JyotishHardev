<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="10" fill="#1b1f4a"/>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="19" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- 12 tick marks -->

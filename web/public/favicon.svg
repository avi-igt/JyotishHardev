  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(60  24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(90  24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(120 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(150 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(180 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(210 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(240 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(270 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(300 24 24)"/>
  <line x1="24" y1="5" x2="24" y2="9"   stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" transform="rotate(330 24 24)"/>
  <!-- Axis spokes -->
  <line x1="24" y1="14" x2="24" y2="6"  stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
  <line x1="34" y1="24" x2="42" y2="24" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
  <line x1="24" y1="34" x2="24" y2="42" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
  <line x1="14" y1="24" x2="6"  y2="24" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="24" cy="24" r="10" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
  <!-- Cardinal dots -->
  <circle cx="24" cy="14" r="1.8" fill="#c9a84c"/>
  <circle cx="34" cy="24" r="1.8" fill="#c9a84c"/>
  <circle cx="24" cy="34" r="1.8" fill="#c9a84c"/>
  <circle cx="14" cy="24" r="1.8" fill="#c9a84c"/>
